<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>QUIZ TIME!</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
</head>
<body>
    <div id="background-image"></div>
    <img id="loading-message" src="./images/Animation - 1742404666290.gif">
    <div id="menu-container">
        <div id="menu-title">QUIZ TIME!</div>
        <p>Welcome to <b>QUIZ TIME!</b>, the ultimate destination for fun and challenging quizzes! Test your knowledge across various categories, from history and science to pop culture and sports.</p>
        <p>Select a category, press play and have a great time!</p>
        <form id="menu-form">
            <select id="category-select">
                <option disabled selected>SELECT A CATEGORY</option>
            </select>
            <button type="submit" id="play-button" class="answer-wrap">
                <div class="answer-border">
                    <div class="answer-container" style="font-size: 20px;">
                        PLAY
                    </div>
                </div>
            </button>           
        </form>  
    </div>
    <div id="quiz-container">
        <div id="question-container">
            <div id="question-text"></div>
            <div id="answers-container">
                <div class="answer-wrap">
                    <div class="answer-border">
                        <div class="answer-container">
                            <div class="answer" id="answer-1"></div>
                        </div>
                    </div>
                </div>
                <div class="answer-wrap">
                    <div class="answer-border">
                        <div class="answer-container">
                            <div class="answer" id="answer-2"></div>
                        </div>
                    </div>
                </div>
                <div class="answer-wrap">
                    <div class="answer-border">
                        <div class="answer-container">
                            <div class="answer" id="answer-3"></div>
                        </div>
                    </div>
                </div>
                <div class="answer-wrap">
                    <div class="answer-border">
                        <div class="answer-container">
                            <div class="answer" id="answer-4"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="buttons-container">
                <button id="menu-button" class="quiz-button">MENU</button>
                <button id="play-again-button" class="quiz-button" disabled>PLAY AGAIN</button>
                <button id="next-button" class="quiz-button" disabled>NEXT QUESTION</button>
            </div>
        </div>
        <div id="progress-container" style="display: flex;">
            <div id="progress-tracker"></div>
            <div id="progress-caption">
                <div class="caption">EASY</div>
                <div class="caption">MEDIUM</div>
                <div class="caption">HARD</div>
            </div>
        </div>
    </div>
</body>
<script src='main.js'></script>
</html>
